<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GHost AI • Login</title>

<style>
/* ================= BASE ================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #1a0025, #000);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", Arial, sans-serif;
  color: #fff;
  overflow: hidden;
}

/* ================= AMBIENT GLOW ================= */
body::before {
  content: "";
  position: absolute;
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(180,60,255,0.35), transparent 65%);
  filter: blur(80px);
  animation: float 10s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-25px); }
  100% { transform: translateY(0px); }
}

/* ================= BOX ================= */
.box {
  width: 390px;
  padding: 44px 42px;
  background: rgba(18,18,18,0.65);
  backdrop-filter: blur(18px);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow:
    0 0 35px rgba(162,0,255,0.35),
    inset 0 0 0 1px rgba(255,255,255,0.05);
  text-align: center;
  animation: enter 0.8s ease forwards;
}

@keyframes enter {
  from { opacity: 0; transform: translateY(30px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ================= HEADER ================= */
h2 {
  font-size: 32px;
  margin-bottom: 22px;
  background: linear-gradient(90deg,#c77dff,#8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ================= INPUT GROUP ================= */
.field {
  position: relative;
  margin-bottom: 18px;
}

.field input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(0,0,0,0.5);
  color: white;
  font-size: 15px;
  outline: none;
  transition: .25s;
}

.field input:focus {
  border-color: #b84cff;
  box-shadow: 0 0 0 3px rgba(184,76,255,.35);
}

/* FLOATING LABEL */
.field label {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  color: rgba(255,255,255,0.55);
  pointer-events: none;
  transition: .25s;
  background: rgba(18,18,18,0.9);
  padding: 0 6px;
}

.field input:focus + label,
.field input:not(:placeholder-shown) + label {
  top: -7px;
  font-size: 11px;
  color: #c77dff;
}

/* ================= PASSWORD ================= */
.password-wrapper {
  position: relative;
}

.toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 20px;
  opacity: .6;
  transition: .2s;
}

.toggle:hover {
  opacity: 1;
  transform: translateY(-50%) scale(1.15);
}

/* ================= BUTTON ================= */
button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg,#7a2cff,#b26bff);
  cursor: pointer;
  box-shadow: 0 0 22px rgba(184,76,255,.6);
  transition: .3s;
  margin-top: 6px;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 40px rgba(184,76,255,.9);
}

/* ================= GOOGLE ================= */
.google-btn {
  margin-top: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px;
  border-radius: 999px;
  background: #fff;
  color: #000;
  font-weight: 600;
  text-decoration: none;
  font-size: 14px;
  transition: .25s;
}

.google-btn img {
  width: 20px;
}

.google-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(255,255,255,.35);
}

/* ================= FOOTER ================= */
a {
  display: inline-block;
  margin-top: 18px;
  font-size: 14px;
  color: #c77dff;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.error {
  color: #ff6b6b;
  font-size: 14px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="box">
  <h2>Welcome Back</h2>

  <form action="/login" method="POST">

    <div class="field">
      <input type="email" name="email" required placeholder=" ">
      <label>Email</label>
    </div>

    <div class="field password-wrapper">
      <input type="password" name="password" id="passwordInput" required placeholder=" ">
      <label>Password</label>
      <span class="toggle" id="togglePw">🐵</span>
    </div>

     {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
  
    <button type="submit">Login</button>
  </form>

  <a href="/forgot-password">Forgot password?</a>

  <a href="/login/google" class="google-btn">
    <img src="/static/Google.png" alt="Google">
    Continue with Google
  </a>

  <a href="/signup">Don’t have an account? Sign up</a>
</div>

<script>
const pw = document.getElementById("passwordInput");
const toggle = document.getElementById("togglePw");

toggle.onclick = () => {
  if (pw.type === "password") {
    pw.type = "text";
    toggle.textContent = "🙈";
  } else {
    pw.type = "password";
    toggle.textContent = "🐵";
  }
};
</script>

</body>
</html>
